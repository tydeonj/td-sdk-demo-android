apply plugin: 'com.android.application'

def tdGroup = (findProperty('TD_GROUP_ID') ?: 'com.tyedo').toString()
def tdVer = (findProperty('TD_VERSION') ?: '1.1.2.7').toString()

android {
    namespace 'com.td.sdkdemo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.td.sdkdemo'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName tdVer
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion '2.6.2'
        }
    }
}

dependencies {
    println("[tdsdkdemo] implementation ${tdGroup}:*:${tdVer} (mavenCentral)")
    implementation "${tdGroup}:td-ads-base:${tdVer}"
    implementation "${tdGroup}:td-ads-sdk:${tdVer}"
    // JinDai（按需）
    implementation "${tdGroup}:jdsdk_ads:${tdVer}"
    implementation files('libs/YDSDK-release.aar')
    // AdGain（按需）
    implementation "${tdGroup}:adgain_ads:${tdVer}"
    implementation 'com.adgain:adgain-sdk:4.1.5'
    // LiteMob（按需）
    implementation "${tdGroup}:ltmb_ads:${tdVer}"
    implementation 'com.ltmb.ltsdk:core:2.9.5'
    // LiteMob 官方要求的支持库
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.protobuf:protobuf-javalite:4.27.3'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-common:2.6.2'
    // OAID（可选，不是广告源）
    implementation 'com.github.gzu-liyujiang:Android_CN_OAID:4.2.17'
    runtimeOnly 'com.huawei.hms:ads-identifier:3.4.62.300'
    runtimeOnly 'com.hihonor.mcs:ads-identifier:1.0.2.301'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.9.0'
}
